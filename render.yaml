services:
  - type: web
    name: connecthub-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run server
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Set these in the Render dashboard — do NOT commit real values here
      - key: PAYSTACK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://connecthub-1873e.web.app
      - key: PAYSTACK_CALLBACK_BASE_URL
        value: https://connecthub-1873e.web.app
      - key: BACKEND_PUBLIC_URL
        value: https://connecthub-yrox.onrender.com
      - key: EXPO_PUBLIC_WEB_BASE_URL
        value: https://connecthub-1873e.web.app
      - key: PAYSTACK_WITHDRAWALS_ENABLED
        value: false
      - key: PAYSTACK_WITHDRAWALS_DISABLED_REASON
        value: Wallet withdrawals are temporarily unavailable while ConnectHub completes Paystack payout activation.
