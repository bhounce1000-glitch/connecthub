services:
  - type: web
    name: connecthub-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard — do NOT commit real values here
      - key: PAYSTACK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WITHDRAWAL_SLA_HOURS
        value: 24
      - key: CORS_ALLOWED_ORIGINS
        value: https://connecthub-1873e.web.app
      - key: PAYSTACK_CALLBACK_BASE_URL
        value: https://connecthub-1873e.web.app
      - key: BACKEND_PUBLIC_URL
        value: https://connecthub-yrox.onrender.com
      - key: EXPO_PUBLIC_WEB_BASE_URL
        value: https://connecthub-1873e.web.app

  - type: cron
    name: connecthub-auto-refund
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node scripts/auto-refund-cron.js
    schedule: "0 * * * *"
    envVars:
      - key: BACKEND_PUBLIC_URL
        value: https://connecthub-yrox.onrender.com
      - key: CRON_SECRET
        sync: false
